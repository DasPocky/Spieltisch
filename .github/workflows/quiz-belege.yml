name: Quiz-Belege

# Prüft, ob jede Quizfrage eine Quelle hat und die Antwort dort steht (Wikipedia & Co. brauchen Netz – darum hier).
# Ergebnis in der Zusammenfassung des Laufs und als Datei quiz-belege.md.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "shared/games/quiz/fragen/**"
      - "scripts/quiz-belege.mjs"
  push:
    branches: [main]
    paths:
      - "shared/games/quiz/fragen/**"

# Nur lesen – kein Job braucht Schreibrechte am Repository
permissions:
  contents: read

jobs:
  belege:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - run: node scripts/quiz-belege.mjs --streng
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: quiz-belege
          path: quiz-belege.md
