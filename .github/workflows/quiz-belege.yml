name: Quiz-Belege

# Prüft, ob jede Quizfrage eine Quelle hat und die Antwort dort steht (Wikipedia & Co. brauchen Netz – darum hier).
# Ergebnis in der Zusammenfassung des Laufs und als Datei quiz-belege.md.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "shared/games/quiz/fragen/**"
      - "scripts/quiz-belege.mjs"
  push:
    branches: [main]
    paths:
      - "shared/games/quiz/fragen/**"

# Nur lesen – kein Job braucht Schreibrechte am Repository
permissions:
  contents: read

jobs:
  belege:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node scripts/quiz-belege.mjs --streng
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quiz-belege
          path: quiz-belege.md
