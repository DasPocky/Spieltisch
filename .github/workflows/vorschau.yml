name: Vorschau aufräumen

# Nach jedem geschlossenen PR die Cloudflare-Vorschau seines Zweigs löschen (siehe scripts/vorschau-aufraeumen.mjs).
# Braucht das Repository-Secret CLOUDFLARE_API_TOKEN (Workers Scripts: Edit); ohne Secret wird nur gewarnt.
on:
  pull_request:
    types: [closed]
  workflow_dispatch:

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Vorschau löschen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BRANCH: ${{ github.head_ref }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::warning::Secret CLOUDFLARE_API_TOKEN fehlt – Vorschau bitte von Hand löschen"; exit 0; fi
          node scripts/vorschau-aufraeumen.mjs $BRANCH
