name: Vorschau aufräumen

# Nach jedem geschlossenen PR die Cloudflare-Vorschau seines Zweigs löschen (siehe scripts/vorschau-aufraeumen.mjs).
# Braucht das Repository-Secret CLOUDFLARE_API_TOKEN: Account-API-Token „spieltisch-vorschau-cleanup“
# (nur Account → Workers Scripts → Edit, siehe docs/betrieb.md). Ohne Secret wird nur gewarnt.
# Läuft nie für PRs aus Forks (die bekämen das Secret ohnehin nicht) – der Zweig muss in diesem Repository liegen.
on:
  pull_request:
    types: [closed]
  workflow_dispatch:

# Nur lesen – kein Job braucht Schreibrechte am Repository
permissions:
  contents: read

jobs:
  clean:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
      - name: Vorschau löschen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BRANCH: ${{ github.head_ref }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::warning::Secret CLOUDFLARE_API_TOKEN fehlt – Vorschau bitte von Hand löschen"; exit 0; fi
          node scripts/vorschau-aufraeumen.mjs ${BRANCH:+"$BRANCH"}
