name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nachts die gründliche Zufallssimulation (viele Partien je Spiel)
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

# Nur lesen – kein Job braucht Schreibrechte am Repository
permissions:
  contents: read

jobs:
  check:
    name: Build & Unit-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Sicherheitslücken: was ausgeliefert wird (ohne Werkzeuge), muss frei von schweren Befunden sein – sonst rot
      - run: npm audit --omit=dev --audit-level=high
      # Werkzeuge (Build, Tests, lokaler Server) laufen nie beim Nutzer: nur als Bericht in der Zusammenfassung
      - name: Werkzeuge prüfen (Bericht)
        if: always()
        run: |
          { echo "## Abhängigkeiten (alle, inkl. Werkzeuge)"; echo '```'; npm audit --audit-level=high 2>&1 | tail -25 || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
      # Zufallspartien: im PR eine kurze Runde, auf main die übliche, nachts gründlich
      - run: npm test
        env:
          SIM_ROUNDS: ${{ github.event_name == 'pull_request' && '5' || github.event_name == 'schedule' && '200' || '25' }}

  # Handy-Tests laufen gleichzeitig mit dem Build, verteilt auf viele Rechner – jeder mit eigenem Server.
  # Öffentliches Repo: Minuten kosten nichts, bis zu 20 Jobs laufen gleichzeitig (hier 16 + Build).
  # Die Admin-Tests schalten Spiele ab und laufen deshalb für sich.
  e2e:
    name: Handy-Tests (${{ matrix.name }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Die schweren Fernseher-Tests (table.spec) laufen auf eigenen Rechnern, damit kein Teil viel länger braucht als die anderen
          - { name: "Spiele 1/12", args: "--project=spiele --no-deps --shard=1/12", setup: true, notable: "1" }
          - { name: "Spiele 2/12", args: "--project=spiele --no-deps --shard=2/12", setup: true, notable: "1" }
          - { name: "Spiele 3/12", args: "--project=spiele --no-deps --shard=3/12", setup: true, notable: "1" }
          - { name: "Spiele 4/12", args: "--project=spiele --no-deps --shard=4/12", setup: true, notable: "1" }
          - { name: "Spiele 5/12", args: "--project=spiele --no-deps --shard=5/12", setup: true, notable: "1" }
          - { name: "Spiele 6/12", args: "--project=spiele --no-deps --shard=6/12", setup: true, notable: "1" }
          - { name: "Spiele 7/12", args: "--project=spiele --no-deps --shard=7/12", setup: true, notable: "1" }
          - { name: "Spiele 8/12", args: "--project=spiele --no-deps --shard=8/12", setup: true, notable: "1" }
          - { name: "Spiele 9/12", args: "--project=spiele --no-deps --shard=9/12", setup: true, notable: "1" }
          - { name: "Spiele 10/12", args: "--project=spiele --no-deps --shard=10/12", setup: true, notable: "1" }
          - { name: "Spiele 11/12", args: "--project=spiele --no-deps --shard=11/12", setup: true, notable: "1" }
          - { name: "Spiele 12/12", args: "--project=spiele --no-deps --shard=12/12", setup: true, notable: "1" }
          - { name: "Tisch 1/2", args: "table.spec --project=spiele --no-deps --shard=1/2", setup: true }
          - { name: "Tisch 2/2", args: "table.spec --project=spiele --no-deps --shard=2/2", setup: true }
          - { name: "Verwaltung", args: "--project=admin --no-deps", setup: false }
          - { name: "Desktop & Fernseher", args: "--project=geraete --no-deps", setup: false }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Browser zwischenspeichern (Schlüssel: Playwright-Version), nur die Systempakete kommen jedes Mal neu
      - id: pw
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # Einrichtung (z. B. „Ein Handy für alle“ einschalten) auf dem eigenen Server dieses Rechners
      - if: matrix.setup
        run: npx playwright test --project=setup
        env:
          CI: true
      - run: npx playwright test ${{ matrix.args }}
        env:
          PW_NO_TABLE: ${{ matrix.notable }}
          CI: true
      # Seitenzustand fehlgeschlagener Tests direkt im Log – ohne den Anhang herunterladen zu müssen
      - if: failure()
        run: find test-results -name error-context.md -exec sh -c 'echo "::group::$1"; cat "$1"; echo "::endgroup::"' _ {} \;
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: screenshots-${{ strategy.job-index }}
          path: |
            screenshots/
            test-results/
          retention-days: 7

  # Ein gemeinsamer Haken für Branch-Schutz und Übersicht: grün, wenn alle Handy-Tests grün sind
  e2e-done:
    name: Handy-Tests (Playwright)
    if: always() && github.event_name != 'schedule'
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.e2e.result }}" = "success"
