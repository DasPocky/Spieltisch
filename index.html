<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3efe7" />
    <script>
      // Farbschema und Look vor dem ersten Zeichnen setzen (kein Aufblitzen)
      try { document.documentElement.dataset.look = JSON.parse(localStorage.getItem("spieltisch:config")).look || "papier"; }
      catch (e) { document.documentElement.dataset.look = "papier"; }
      try {
        var c = localStorage.getItem("spieltisch:theme");
        var d = c === "dark" || (c === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = d ? "dark" : "light";
      } catch (e) { document.documentElement.dataset.theme = "light"; }
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Spieltisch" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Spieltisch</title>
    <meta name="description" content="Eure Spielesammlung für den Spieleabend – FuenfWuerfel, Eins, Werwolf, Alles und mehr. Ein Handy für alle oder jeder am eigenen, auch offline." />

    <meta property="og:site_name" content="Spieltisch" />
    <meta property="og:title" content="Spieltisch – euer Spieleabend am Handy" />
    <meta property="og:description" content="FuenfWuerfel, Eins, Werwolf, Alles und mehr: ein Handy für alle oder jeder am eigenen. Raum öffnen, Code teilen, losspielen." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="de_DE" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>

</html>
